<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Studio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- API Key 设置弹窗 -->
  <div id="modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-icon">🔑</div>
      <h2>配置 API Key</h2>
      <p>请输入你的 MiniMax API Key，密钥仅保存在本地浏览器中</p>
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" />
      <input type="text" id="groupIdInput" placeholder="Group ID（纯数字）" autocomplete="off" style="margin-top:10px;" />
      <p style="font-size:12px;color:#94a3b8;margin-top:6px;margin-bottom:0;">Group ID 在 MiniMax 平台「账户信息」页面查看</p>
      <div id="modalError" class="modal-error"></div>
      <button class="btn-primary" onclick="saveApiKey()">开始使用</button>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="logo">✨</span>
      <span class="logo-text">Prompt Studio</span>
    </div>
    <div class="header-right">
      <button class="btn-icon" onclick="newChat()" title="新对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        新对话
      </button>
      <button class="btn-icon" onclick="openSettings()" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
    </div>
  </header>

  <!-- 主区域 -->
  <main class="main">

    <!-- 左侧对话区 -->
    <section class="chat-section">
      <div id="messages" class="messages"></div>
      <div class="input-wrap">
        <textarea
          id="userInput"
          class="input-box"
          placeholder="描述你想要创建的提示词需求…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="sendBtn" class="btn-send" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </section>

    <!-- 右侧预览区 -->
    <aside class="sidebar">

      <!-- Prompt 预览 -->
      <div class="card preview-card">
        <div class="card-header">
          <span class="card-title">📄 生成的 Prompt</span>
          <button id="copyBtn" class="btn-copy" onclick="copyPrompt()" disabled>复制</button>
        </div>
        <div id="promptContent" class="prompt-content">
          <p class="placeholder-text">与 AI 对话后，<br/>生成的 Prompt 将显示在这里</p>
        </div>
      </div>

      <!-- 质量清单 -->
      <div class="card checklist-card">
        <div class="card-header">
          <span class="card-title">✅ 质量检查</span>
          <span id="checkScore" class="score">0 / 6</span>
        </div>
        <ul class="checklist" id="checklist">
          <li data-key="io">
            <span class="check-icon">○</span>
            <span class="check-label">输入输出说明具体</span>
          </li>
          <li data-key="format">
            <span class="check-icon">○</span>
            <span class="check-label">格式要求明确</span>
          </li>
          <li data-key="style">
            <span class="check-icon">○</span>
            <span class="check-label">风格定位清楚</span>
          </li>
          <li data-key="limit">
            <span class="check-icon">○</span>
            <span class="check-label">限制条件明确</span>
          </li>
          <li data-key="lang">
            <span class="check-icon">○</span>
            <span class="check-label">语言简洁易懂</span>
          </li>
          <li data-key="struct">
            <span class="check-icon">○</span>
            <span class="check-label">结构清晰可读</span>
          </li>
        </ul>
      </div>

    </aside>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
